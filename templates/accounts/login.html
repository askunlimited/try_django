{% extends "base.html" %}

{% block content %}

{% if not request.user.is_authenticated %}

    <div style="margin-top: 30px">

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button style="margin-top: 10px" type="submit">Login</button>

        </form>
        <p>Don't have an account? <a href="/register"> Register</a> </p>
    <div>
{% else %}
<p>You are already logged in. Would you like to <a href="{% url "logout" %}"> logout ?</a> </p>

{% endif %}

{% endblock content %}
